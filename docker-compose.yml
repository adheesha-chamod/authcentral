# Infra only (run app locally):
#   docker compose --profile infra up -d
#   ./mvnw spring-boot:run
#
# Full stack:
#   docker compose --profile infra --profile app up -d --build

services:

  mysql:
    profiles: [infra]
    image: mysql:8.0
    container_name: authcentral-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: authcentral
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    profiles: [infra]
    image: quay.io/keycloak/keycloak:26.5.6
    container_name: authcentral-keycloak
    command: start-dev
    ports:
      - "8181:8080"
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: root
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  app:
    profiles: [app]
    build: .
    container_name: authcentral-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/authcentral
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/app-realm
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: app-realm
      KEYCLOAK_CLIENT_ID: spring-client
      KEYCLOAK_CLIENT_SECRET: secret
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: on-failure

volumes:
  mysql_data:
